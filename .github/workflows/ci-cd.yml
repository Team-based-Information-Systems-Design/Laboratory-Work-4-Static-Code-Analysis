# CI/CD конвейер команды №2 — вариант для ЛР4 (статический анализ кода SpotBugs), версия 2
#   CI  — непрерывная интеграция: на каждый push и pull request скрипт scripts/run_spotbugs.sh
#         компилирует и анализирует все три задания (task1, library, colt), результаты сверяются
#         с отчётами из папки results;
#   CD  — непрерывная доставка: отчёты анализа (XML, TXT) публикуются как артефакт;
#   CD  — непрерывное развёртывание: при push тега v* автоматически создаётся GitHub Release с отчётами.
# Код заданий намеренно содержит ошибки (примеры для анализатора), поэтому находки SpotBugs сборку не роняют.

name: CI/CD

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: CI — сборка и анализ SpotBugs
    runs-on: ubuntu-latest
    env:
      LC_ALL: C.UTF-8
      APP_NAME: ${{ github.event.repository.name }}

    steps:
      - name: Получение кода из репозитория
        uses: actions/checkout@v4

      - name: Установка JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Сохранение эталонных отчётов из репозитория
        run: cp -r results results_ref 2>/dev/null || mkdir -p results_ref

      - name: Компиляция и анализ SpotBugs трёх заданий (scripts/run_spotbugs.sh)
        run: bash scripts/run_spotbugs.sh

      - name: Сверка с отчётами из папки results
        run: |
          {
            echo "## Сверка с отчётами из репозитория"
            echo
            echo "| Задание | В CI | В отчёте | Результат |"
            echo "|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          for name in task1 library colt; do
            act=$(grep -c "<BugInstance" "results/$name.xml" || true)
            if [ -f "results_ref/$name.xml" ]; then
              exp=$(grep -c "<BugInstance" "results_ref/$name.xml" || true)
              if [ "$exp" = "$act" ]; then res="совпадает"; else res="отличается"
                echo "::warning::$name: в CI $act предупреждений, в отчёте $exp"
              fi
            else
              exp="—"; res="эталона нет"
            fi
            echo "$name: CI=$act, отчёт=$exp — $res"
            echo "| $name | $act | $exp | $res |" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Доставка — публикация отчётов анализа
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}
          path: |
            results/*.xml
            results/*.txt
          retention-days: 30

  release:
    name: CD — развёртывание релиза
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Получение отчётов анализа
        uses: actions/download-artifact@v4
        with:
          name: ${{ github.event.repository.name }}
          path: reports

      - name: Публикация GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: reports/*
          generate_release_notes: true
