# CI/CD конвейер команды №2 — вариант для ЛР4 (статический анализ кода SpotBugs)
#   CI  — непрерывная интеграция: компиляция task1 и статический анализ SpotBugs на каждый push и pull request,
#         сверка числа предупреждений с отчётом results/lab4_task1.xml;
#   CD  — непрерывная доставка: отчёты анализа (HTML, XML, TXT) и .jar публикуются как артефакт;
#   CD  — непрерывное развёртывание: при push тега v* автоматически создаётся GitHub Release с отчётами.
# Код task1 намеренно содержит ошибки (примеры для анализатора), поэтому находки SpotBugs сборку не роняют.

name: CI/CD

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

env:
  SPOTBUGS_VERSION: '4.8.6'

jobs:
  build:
    name: CI — сборка и анализ SpotBugs
    runs-on: ubuntu-latest
    env:
      LC_ALL: C.UTF-8
      APP_NAME: ${{ github.event.repository.name }}

    steps:
      - name: Получение кода из репозитория
        uses: actions/checkout@v4

      - name: Установка JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Компиляция task1
        run: |
          mkdir -p build/classes
          find task1/src -name '*.java' > build/sources.txt
          javac -encoding UTF-8 --release 17 -nowarn -proc:none -d build/classes @build/sources.txt
          echo "Скомпилировано классов: $(find build/classes -name '*.class' | wc -l)"

      - name: Установка SpotBugs ${{ env.SPOTBUGS_VERSION }}
        run: |
          curl -sSL -o spotbugs.tgz \
            "https://github.com/spotbugs/spotbugs/releases/download/${SPOTBUGS_VERSION}/spotbugs-${SPOTBUGS_VERSION}.tgz"
          tar xzf spotbugs.tgz
          echo "SPOTBUGS_JAR=$PWD/spotbugs-${SPOTBUGS_VERSION}/lib/spotbugs.jar" >> "$GITHUB_ENV"

      - name: Статический анализ SpotBugs (effort max, confidence low)
        run: |
          mkdir -p reports
          java -jar "$SPOTBUGS_JAR" -textui -effort:max -low -sourcepath task1/src \
            -xml:withMessages -output reports/spotbugs.xml build/classes
          java -jar "$SPOTBUGS_JAR" -textui -effort:max -low -sortByClass \
            -output reports/spotbugs.txt build/classes
          java -jar "$SPOTBUGS_JAR" -textui -effort:max -low -sourcepath task1/src \
            -html:plain.xsl -output reports/spotbugs.html build/classes
          cat reports/spotbugs.txt

      - name: Сводка результатов анализа
        run: |
          COUNT=$(grep -c "<BugInstance" reports/spotbugs.xml || true)
          {
            echo "## Результаты SpotBugs ${SPOTBUGS_VERSION}"
            echo
            echo "Найдено предупреждений: **${COUNT}**"
            echo
            echo "| Приоритет | Категория | Описание |"
            echo "|---|---|---|"
            awk '{
              p = ($1=="H") ? "Высокий" : ($1=="M") ? "Средний" : "Низкий";
              c = $2;
              if (c=="C") c="Корректность"; else if (c=="M") c="Многопоточность";
              else if (c=="B") c="Плохая практика"; else if (c=="P") c="Производительность";
              else if (c=="D") c="Сомнительный код"; else if (c=="S") c="Безопасность";
              else if (c=="I") c="Интернационализация";
              $1=""; $2=""; sub(/^ +/, ""); gsub(/\|/, "\\|");
              print "| " p " | " c " | " $0 " |"
            }' reports/spotbugs.txt
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Сверка с отчётом results/lab4_task1.xml
        if: hashFiles('results/lab4_task1.xml') != ''
        run: |
          EXPECTED=$(grep -c "<BugInstance" results/lab4_task1.xml || true)
          ACTUAL=$(grep -c "<BugInstance" reports/spotbugs.xml || true)
          echo "В отчёте: $EXPECTED, в CI: $ACTUAL"
          if [ "$EXPECTED" -ne "$ACTUAL" ]; then
            echo "::error::Число предупреждений ($ACTUAL) не совпадает с отчётом results/lab4_task1.xml ($EXPECTED)"
            exit 1
          fi
          echo "OK — результат анализа совпадает с отчётом"

      - name: Сборка .jar
        run: jar --create --file "reports/$APP_NAME.jar" -C build/classes .

      - name: Доставка — публикация отчётов анализа
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}
          path: reports/
          retention-days: 30

  release:
    name: CD — развёртывание релиза
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Получение отчётов и .jar
        uses: actions/download-artifact@v4
        with:
          name: ${{ github.event.repository.name }}
          path: reports

      - name: Публикация GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: reports/*
          generate_release_notes: true
